name: Phone speed check

# Runs the Web Platform Slow 4G Mobile Check Profile on every push and pull
# request, and fails the run if any value in speed-budget.json is missed:
#   - performance_score_min  (Lighthouse, simulate.config.cjs)
#   - size_grid_shift_px_max and size_button_min_px  (scripts/check-live.mjs)
#
# By default it builds this commit and serves it on the runner, so the check needs
# no Vercel secrets. To check a deployed address instead (a Vercel preview or the
# live site), start it by hand from the Actions tab and fill in "url".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      url:
        description: "Address to check instead of building this commit (for example the live or preview URL)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  phone-speed-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      CHROME_PATH: /usr/bin/google-chrome
      TARGET_URL: ${{ inputs.url || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and start this commit
        if: ${{ inputs.url == '' }}
        run: |
          npm run build
          nohup npx next start -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "Server did not start"; cat next-start.log; exit 1

      - name: Lighthouse, mobile, Slow 4G, 4x CPU (median of 3 runs)
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@13.6.0 "$TARGET_URL" \
              --config-path=traces/2026-11-20-slow4g/simulate.config.cjs \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output=html --output-path=./lighthouse-$i --quiet
          done
          node scripts/check-lighthouse.mjs lighthouse-1.report.json lighthouse-2.report.json lighthouse-3.report.json

      - name: Size grid shift and size button size
        if: ${{ !cancelled() }}
        run: node scripts/check-live.mjs "$TARGET_URL" 3

      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            lighthouse-*.report.html
            lighthouse-*.report.json
          if-no-files-found: ignore
